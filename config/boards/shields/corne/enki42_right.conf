CONFIG_ZMK_SLEEP=y
CONFIG_PM_DEVICE=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_EXT_POWER=y

CONFIG_ZMK_RGB_UNDERGLOW=n

CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Built-in status screen (the zmk-nice-oled custom screen is v0.3-only)
CONFIG_ZMK_DISPLAY=y

# Isolate LVGL rendering from the system/BLE work queues and give it enough memory.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# Don't let a stuck I2C transfer block the display thread for half a second.
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=200
